name: paragliding_mvp_frontend
description: Korea-focused paragliding companion app built with Flutter.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  http: ^1.3.0
  image_picker: ^1.1.2
  latlong2: ^0.9.1
  maplibre: ^0.3.4+1
  share_plus: ^10.1.4
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/data/
