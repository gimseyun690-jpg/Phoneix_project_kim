services:
  postgres:
    image: postgres:16
    container_name: paragliding_mvp_postgres
    environment:
      POSTGRES_DB: paragliding_mvp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
